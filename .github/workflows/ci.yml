# This intentionally reflects the repo's actual current state rather than assuming
# a package that doesn't exist yet: the `continuum` package (pyproject.toml,
# src/, tests/) lands in a later build step, not yet. Until then, this only lints
# whatever real Python exists (spikes/, which is self-contained via PEP 723 inline
# script metadata and needs no project install). Once pyproject.toml is committed,
# the package-dependent steps below activate automatically -- nothing here needs
# editing when that happens. The CockroachDB service container's exact startup args
# still need validation once integration tests actually exist to run against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      cockroachdb:
        image: cockroachdb/cockroach:latest
        ports:
          - 26257:26257
        options: >-
          --health-cmd "curl -f http://localhost:8080/health?ready=1 || exit 1"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check whether the continuum package exists yet
        id: package
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Lint whatever Python exists (spikes/, and src/ once it lands)
        run: uvx ruff check spikes/

      - name: Install dependencies
        if: steps.package.outputs.exists == 'true'
        run: uv sync --dev

      - name: Lint package
        if: steps.package.outputs.exists == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        if: steps.package.outputs.exists == 'true'
        run: uv run pytest tests/unit -v

      - name: Integration tests
        if: steps.package.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://root@localhost:26257/continuum?sslmode=disable
        run: uv run pytest tests/integration -v

      - name: Build package
        if: steps.package.outputs.exists == 'true'
        run: uv build --wheel
