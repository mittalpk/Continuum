# This intentionally reflects the repo's actual current state rather than assuming
# a package that doesn't exist yet: the `continuum` package (pyproject.toml,
# src/, tests/) lands in a later build step, not yet. Until then, this only lints
# whatever real Python exists (spikes/, which is self-contained via PEP 723 inline
# script metadata and needs no project install). Once pyproject.toml is committed,
# the package-dependent steps below activate automatically -- nothing here needs
# editing when that happens.
#
# CockroachDB is started via a plain `docker run` step, not the `services:` block --
# GitHub Actions service containers only support setting image/env/ports/options,
# with no way to override the container's command, and cockroachdb/cockroach needs
# `start-single-node --insecure` as its command to actually run. Without that it
# just executes its default command and exits immediately, which is why the
# services-block version failed before any workflow step even ran.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start CockroachDB (single-node, insecure, CI only)
        run: |
          docker run -d --name cockroachdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:latest start-single-node --insecure
          for i in $(seq 1 30); do
            if docker exec cockroachdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB is ready"
              exit 0
            fi
            echo "Waiting for CockroachDB... ($i/30)"
            sleep 2
          done
          echo "CockroachDB did not become ready in time" >&2
          docker logs cockroachdb
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check whether the continuum package exists yet
        id: package
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Lint whatever Python exists (spikes/, and src/ once it lands)
        run: uvx ruff check spikes/

      - name: Install dependencies
        if: steps.package.outputs.exists == 'true'
        run: uv sync --dev

      - name: Lint package
        if: steps.package.outputs.exists == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        if: steps.package.outputs.exists == 'true'
        run: uv run pytest tests/unit -v

      - name: Integration tests
        if: steps.package.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://root@localhost:26257/continuum?sslmode=disable
        run: uv run pytest tests/integration -v

      - name: Build package
        if: steps.package.outputs.exists == 'true'
        run: uv build --wheel

      - name: Stop CockroachDB
        if: always()
        run: docker rm -f cockroachdb
