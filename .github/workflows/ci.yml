# Skeleton CI workflow — the CockroachDB service container's exact startup args need
# validation once real tests exist (tracked in docs/EXECUTION_RUNBOOK.md). Not yet
# exercised against a real test suite, since none is committed yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      cockroachdb:
        image: cockroachdb/cockroach:latest
        ports:
          - 26257:26257
        options: >-
          --health-cmd "curl -f http://localhost:8080/health?ready=1 || exit 1"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://root@localhost:26257/continuum?sslmode=disable
        run: uv run pytest tests/integration -v

      - name: Build package
        run: uv build --wheel
