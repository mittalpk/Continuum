[project]
name = "continuum"
version = "0.1.0"
description = "Agentic memory layer for MCP-compatible agents, backed by CockroachDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "mcp>=1.0",
    "boto3>=1.34",
    "mangum>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
